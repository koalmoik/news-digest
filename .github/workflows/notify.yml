# Sends the ntfy notification as soon as the routine pushes a new digest.
# Runs on GitHub instead of the cloud sandbox, because ntfy.sh often answers HTTP 429 there
# (rate limit per IP, and sandbox IPs are shared).
name: Notify phone

on:
  push:
    branches: [main, claude/digest]
    paths: ['digests/*.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: New digest in this push?
        id: check
        run: |
          # Only notify for a newly added digest, not for later corrections
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || \
             git diff --name-only --diff-filter=A HEAD^ HEAD -- 'digests/*.json' | grep -q .; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new digest, nothing to do."
          fi

      - name: Send ntfy
        if: steps.check.outputs.send == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # about 38 minutes of retries on HTTP 429
          NTFY_RETRY_WAITS: '30,60,120,180,300,300,600,700'
          BRANCH: ${{ github.ref_name }}
        run: python3 notify.py "$BRANCH"
